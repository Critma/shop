services:
  nginx:
    image: nginx:1.29.7-alpine
    container_name: nginx
    environment:
      SERVICE_HOST: ${SERVICE_HOST-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ../web/static:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    env_file:
      - path: ../config/.env
        required: false
    depends_on:
      - api
      - api2
      - api3

  api:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    container_name: shopapi
    environment:
      POSTGRES_HOST: postgres
      SERVICE_HOST: api
      AUTH_HOST: ${AUTH_HOST-host.docker.internal}
    env_file:
      - path: ../config/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  api2:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      SERVICE_HOST: api2
      SERVICE_PORT: 8081
      AUTH_HOST: ${AUTH_HOST-host.docker.internal}
    env_file:
      - path: ../config/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  api3:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      SERVICE_HOST: api3
      SERVICE_PORT: 8082
      AUTH_HOST: ${AUTH_HOST-host.docker.internal}
    env_file:
      - path: ../config/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.3-alpine3.23
    container_name: pg_shopapi
    environment:
      POSTGRES_USER: ${POSTGRES_USER-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-admin}
      POSTGRES_DB: ${POSTGRES_DB-shopapi}
      PGUSER: ${POSTGRES_USER-admin}
      PGDATABASE: ${POSTGRES_DB-shopapi}
    volumes:
      - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - path: ../config/.env
        required: false
    ports:
      - "${POSTGRES_PORT-5432}:5432"

  pgadmin:
    image: dpage/pgadmin4:9.14.0
    container_name: pgadmin_shopapi
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL-user@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD-securepassword}
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    env_file:
      - path: ../config/.env
        required: false
    depends_on:
      - postgres

volumes:
  pg_data:
  pgadmin_data:
