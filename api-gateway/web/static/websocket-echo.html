<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>WebSocket Client</title>
</head>

<body>
    <h1>WebSocket Эхо-клиент</h1>
    <h3>Откройте консоль в инструмантах разработчика: f12</h3>
    <script>
        const socket = new WebSocket('ws://shopapi.local/ws');

        socket.onopen = function (event) {
            console.log('✅ Соединение по WebSocket установлено');
        };

        socket.onmessage = function (event) {
            const data = JSON.parse(event.data);
            console.log('📩 Получено по WebSocket:', data);
        };

        socket.onclose = function (event) {
            console.log('❌ Соединение закрыто');
        };

        socket.onerror = function (error) {
            console.error('⚠️ Ошибка WebSocket:', error);
        };
    </script>
</body>

</html>
