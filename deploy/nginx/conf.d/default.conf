upstream backend {
    server api:8080 weight=2;
    server api2:8081;
    server api3:8082;
}

upstream backend_write {
    server api:8080;
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/xml application/xml+rss application/javascript application/atom+xml;
gzip_disable "^(image/.*|application/pdf|application/zip)";

server {
    listen 80;
    server_name shopapi.local www.shopapi.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shopapi.local www.shopapi.local;

    ssl_certificate /etc/nginx/ssl/shopapi.local.crt;
    ssl_certificate_key /etc/nginx/ssl/shopapi.local.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access_http.log;
    error_log /var/log/nginx/error_http.log warn;

    location /status {
        stub_status on;
        # allow 127.0.0.1;
        # deny all;
    }

    location / {
        root /usr/share/nginx/html;

        try_files $uri $uri/ =404;
    }
    location /admin/ {
        proxy_set_header X-Script-Name /admin;
        proxy_pass http://pgadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /openapi.yaml {
        proxy_pass http://backend;
    }
    location = /api/v1/ {
        rewrite ^/(.*)$ /swagger break;

        proxy_pass http://backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }
    location ~ ^/(api/v1|api/v2)/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET HEAD;

        set $no_cache 0;
        if ($request_method != GET) {
            set $no_cache 1;
        }
        proxy_cache_bypass $no_cache;
        proxy_no_cache $no_cache;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        set $backend_upstream "backend_write";
        if ($request_method = GET) {
            set $backend_upstream "backend";
        }

        proxy_pass http://$backend_upstream;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}