services:
  api:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    container_name: service_auth
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AUTH_HOST: api
      AUTH_PORT: 9090
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9090:9090"

  postgres:
    image: postgres:18.3-alpine3.23
    container_name: pg_auth
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: auth
    volumes:
      - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - pg_auth_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d auth -U admin" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5440:5432"

volumes:
  pg_auth_data:
